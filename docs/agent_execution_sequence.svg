<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2200" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-solid-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-solid-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f8fafc" />
    </marker>
    <marker id="arrow-dashed-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-dashed-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-solid-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-solid-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-solid-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-solid-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="850" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">PAYMENT SETTLEMENT INVESTIGATION AGENT</text>
  <text x="850" y="85" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="500">Multi-Turn Bounded Agent Loop, Tool Execution &amp; Evidence Citations Sequence</text>
  <line x1="80" y1="110" x2="1620" y2="110" stroke="#334155" stroke-width="2" />

  <!-- Lifelines -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6,6">
    <line x1="150" y1="180" x2="150" y2="2060" />
    <line x1="440" y1="180" x2="440" y2="2060" />
    <line x1="730" y1="180" x2="730" y2="2060" />
    <line x1="1020" y1="180" x2="1020" y2="2060" />
    <line x1="1310" y1="180" x2="1310" y2="2060" />
    <line x1="1570" y1="180" x2="1570" y2="2060" />
  </g>

  <!-- Top Participant Cards -->
  <g text-anchor="middle">
    <!-- UI -->
    <rect x="65" y="130" width="170" height="55" rx="8" fill="#0c4a60" stroke="#0ea5e9" stroke-width="2" />
    <text x="150" y="152" fill="#f8fafc" font-size="14" font-weight="600">React Workstation</text>
    <text x="150" y="172" fill="#38bdf8" font-size="11">Frontend UI</text>

    <!-- Loop -->
    <rect x="355" y="130" width="170" height="55" rx="8" fill="#581c87" stroke="#a855f7" stroke-width="2" />
    <text x="440" y="152" fill="#f8fafc" font-size="14" font-weight="600">loop.go (Engine)</text>
    <text x="440" y="172" fill="#c084fc" font-size="11">Multi-Turn Loop</text>

    <!-- Schemas -->
    <rect x="645" y="130" width="170" height="55" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
    <text x="730" y="152" fill="#f8fafc" font-size="14" font-weight="600">schemas.go</text>
    <text x="730" y="172" fill="#fbbf24" font-size="11">Tool Definitions</text>

    <!-- LLM -->
    <rect x="935" y="130" width="170" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="1020" y="152" fill="#f8fafc" font-size="14" font-weight="600">External Model</text>
    <text x="1020" y="172" fill="#4ade80" font-size="11">Gemini / Claude</text>

    <!-- Tools -->
    <rect x="1225" y="130" width="170" height="55" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="2" />
    <text x="1310" y="152" fill="#f8fafc" font-size="14" font-weight="600">tools.go (Runner)</text>
    <text x="1310" y="172" fill="#fb7185" font-size="11">Tool Execution</text>

    <!-- DB -->
    <rect x="1485" y="130" width="170" height="55" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="1570" y="152" fill="#f8fafc" font-size="14" font-weight="600">Postgres DB</text>
    <text x="1570" y="172" fill="#60a5fa" font-size="11">Storage &amp; Ledger</text>
  </g>

  <!-- Step 1: POST Trigger -->
  <line x1="150" y1="225" x2="440" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid-cyan)" />
  <circle cx="180" cy="225" r="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="180" y="229" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="295" y="217" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">POST /api/exceptions/30/investigate</text>

  <!-- Setup Context Note -->
  <rect x="290" y="250" width="300" height="30" rx="6" fill="#334155" stroke="#a855f7" stroke-width="1.5" />
  <text x="440" y="270" fill="#f8fafc" font-size="11" text-anchor="middle">1. Setup Context &amp; Evidence Registry Initialized</text>

  <!-- Step 2: GetAgentTools -->
  <line x1="440" y1="310" x2="730" y2="310" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-solid-amber)" />
  <circle cx="470" cy="310" r="11" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="470" y="314" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="585" y="302" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">GetAgentTools()</text>

  <!-- Step 3: Return Schemas -->
  <line x1="730" y1="350" x2="440" y2="350" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-amber)" />
  <circle cx="700" cy="350" r="11" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="700" y="354" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="585" y="342" fill="#fbbf24" font-size="11" font-weight="500" text-anchor="middle">Returns 4 JSON Tool Specifications</text>

  <!-- GROUP 1: Turn 1 LLM Request -->
  <rect x="410" y="385" width="640" height="160" rx="12" fill="#131d33" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
  <rect x="425" y="375" width="260" height="22" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="435" y="390" fill="#4ade80" font-size="11" font-weight="700">TURN 1: LLM Requests a Tool Call</text>

  <!-- Step 4 -->
  <line x1="440" y1="430" x2="1020" y2="430" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow-solid-white)" />
  <circle cx="470" cy="430" r="11" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5" />
  <text x="470" y="434" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="730" y="422" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">GenerateTurn(SystemPrompt, UserPrompt, Tools)</text>

  <!-- Note over LLM -->
  <rect x="870" y="455" width="300" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="1020" y="472" fill="#4ade80" font-size="10.5" text-anchor="middle">LLM selects: search_adjacent_ledger_entries</text>

  <!-- Step 5 -->
  <line x1="1020" y1="510" x2="440" y2="510" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-green)" />
  <circle cx="990" cy="510" r="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
  <text x="990" y="514" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="730" y="502" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ToolCall("search_adjacent_ledger_entries", {target: "bank_deposits"})</text>

  <!-- GROUP 2: Turn 1 Local Tool Execution -->
  <rect x="410" y="570" width="1200" height="290" rx="12" fill="#131d33" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
  <rect x="425" y="560" width="280" height="22" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
  <text x="435" y="575" fill="#fb7185" font-size="11" font-weight="700">TURN 1: Local Tool Execution (tools.go)</text>

  <!-- Step 6 -->
  <line x1="440" y1="620" x2="1310" y2="620" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-solid-rose)" />
  <circle cx="470" cy="620" r="11" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="470" y="624" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">6</text>
  <text x="875" y="612" fill="#f43f5e" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ExecuteTool("search_adjacent_ledger_entries", argsJSON)</text>

  <!-- Step 7 -->
  <line x1="1310" y1="670" x2="1570" y2="670" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid-blue)" />
  <circle cx="1340" cy="670" r="11" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
  <text x="1340" y="674" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">7</text>
  <text x="1440" y="662" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle" font-family="monospace">SELECT * FROM bank_transactions...</text>

  <!-- Step 8 -->
  <line x1="1570" y1="720" x2="1310" y2="720" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-green)" />
  <circle cx="1540" cy="720" r="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
  <text x="1540" y="724" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">8</text>
  <text x="1440" y="712" fill="#4ade80" font-size="11" font-weight="500" text-anchor="middle">Found ₹38,000 split deposit (TXN-BNK-002)</text>

  <!-- Step 9 -->
  <line x1="1310" y1="770" x2="440" y2="770" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-solid-rose)" />
  <circle cx="1280" cy="770" r="11" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="1280" y="774" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">9</text>
  <text x="875" y="760" fill="#f43f5e" font-size="11.5" font-weight="500" text-anchor="middle">Return JSON Result + Register Evidence "TXN-BNK-002"</text>

  <!-- Step 10 -->
  <line x1="440" y1="820" x2="1570" y2="820" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-solid-slate)" />
  <circle cx="470" cy="820" r="11" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <text x="470" y="824" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">10</text>
  <text x="1005" y="810" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle" font-family="monospace">INSERT INTO workflow_steps (status: 'ok', duration: 4ms)</text>

  <!-- GROUP 3: Turn 2 Feeding Results Back -->
  <rect x="410" y="885" width="640" height="240" rx="12" fill="#131d33" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />
  <rect x="425" y="875" width="260" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="890" fill="#c084fc" font-size="11" font-weight="700">TURN 2: Feeding Results Back to LLM</text>

  <rect x="300" y="920" width="280" height="26" rx="6" fill="#334155" stroke="#a855f7" stroke-width="1" />
  <text x="440" y="937" fill="#f8fafc" font-size="10.5" text-anchor="middle">Append ToolResult to conversation history</text>

  <!-- Step 11 -->
  <line x1="440" y1="980" x2="1020" y2="980" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow-solid-white)" />
  <circle cx="470" cy="980" r="11" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5" />
  <text x="470" y="984" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">11</text>
  <text x="730" y="970" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">GenerateTurn(Messages with ToolResult [₹38,000 found])</text>

  <!-- Note over LLM -->
  <rect x="830" y="1010" width="380" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="1020" y="1027" fill="#4ade80" font-size="10" text-anchor="middle">LLM verifies ₹38,000 matches variance, decides to draft remediation</text>

  <!-- Step 12 -->
  <line x1="1020" y1="1070" x2="440" y2="1070" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-green)" />
  <circle cx="990" cy="1070" r="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
  <text x="990" y="1074" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">12</text>
  <text x="730" y="1060" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ToolCall("draft_remediation_entry", {action_type: "link_deposit"})</text>

  <!-- GROUP 4: Turn 2 Drafting Remediation & Conclusion -->
  <rect x="410" y="1150" width="1200" height="580" rx="12" fill="#131d33" stroke="#fbbf24" stroke-width="1.5" opacity="0.9" />
  <rect x="425" y="1140" width="320" height="22" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="435" y="1155" fill="#fbbf24" font-size="11" font-weight="700">TURN 2: Drafting Remediation &amp; Conclusion</text>

  <!-- Step 13 -->
  <line x1="440" y1="1200" x2="1310" y2="1200" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-solid-rose)" />
  <circle cx="470" cy="1200" r="11" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="470" y="1204" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">13</text>
  <text x="875" y="1190" fill="#f43f5e" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ExecuteTool("draft_remediation_entry", target: "TXN-BNK-002")</text>

  <!-- Evidence Note -->
  <rect x="1140" y="1230" width="340" height="26" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1" />
  <text x="1310" y="1247" fill="#f8fafc" font-size="10.5" text-anchor="middle">Evidence Validation: TXN-BNK-002 verified in registry</text>

  <!-- Step 14 -->
  <line x1="1310" y1="1290" x2="1570" y2="1290" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid-blue)" />
  <circle cx="1340" cy="1290" r="11" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
  <text x="1340" y="1294" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">14</text>
  <text x="1440" y="1280" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle" font-family="monospace">INSERT INTO remediations...</text>

  <!-- Step 15 -->
  <line x1="1310" y1="1340" x2="440" y2="1340" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-green)" />
  <circle cx="1280" cy="1340" r="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
  <text x="1280" y="1344" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">15</text>
  <text x="875" y="1330" fill="#4ade80" font-size="11.5" font-weight="500" text-anchor="middle">Remediation #2 created successfully (status: draft)</text>

  <!-- Step 16 -->
  <line x1="440" y1="1400" x2="1020" y2="1400" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow-solid-white)" />
  <circle cx="470" cy="1400" r="11" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5" />
  <text x="470" y="1404" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">16</text>
  <text x="730" y="1388" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">GenerateTurn(Remediation #2 drafted)</text>

  <!-- Step 17 -->
  <line x1="1020" y1="1460" x2="440" y2="1460" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed-green)" />
  <circle cx="990" cy="1460" r="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
  <text x="990" y="1464" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">17</text>
  <text x="730" y="1448" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ToolCall("submit_conclusion", {conclusion: "proposal_ready"})</text>

  <!-- Step 18 -->
  <line x1="440" y1="1520" x2="1310" y2="1520" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-solid-rose)" />
  <circle cx="470" cy="1520" r="11" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="470" y="1524" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">18</text>
  <text x="875" y="1508" fill="#f43f5e" font-size="12" font-weight="600" text-anchor="middle" font-family="monospace">ExecuteTool("submit_conclusion", cited_evidence: ["TXN-BNK-002"])</text>

  <!-- Conclusion Note -->
  <rect x="290" y="1560" width="300" height="28" rx="6" fill="#581c87" stroke="#a855f7" stroke-width="1.5" />
  <text x="440" y="1578" fill="#f8fafc" font-size="10.5" text-anchor="middle">Bounded Loop Terminated: proposal_ready verified</text>

  <!-- Step 19: DB update -->
  <line x1="440" y1="1630" x2="1570" y2="1630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-solid-slate)" />
  <circle cx="470" cy="1630" r="11" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <text x="470" y="1634" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">19</text>
  <text x="1005" y="1618" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle" font-family="monospace">UPDATE exception_runs SET status = 'completed', outcome = 'proposal_ready'</text>

  <!-- Step 20: 200 OK back to UI -->
  <line x1="440" y1="1790" x2="150" y2="1790" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#arrow-solid-cyan)" />
  <circle cx="410" cy="1790" r="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="410" y="1794" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">20</text>
  <text x="295" y="1775" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">200 OK: Investigation completed (Proposal Ready)</text>

  <!-- Bottom Participant Cards -->
  <g text-anchor="middle">
    <rect x="65" y="1850" width="170" height="55" rx="8" fill="#0c4a60" stroke="#0ea5e9" stroke-width="2" />
    <text x="150" y="1872" fill="#f8fafc" font-size="14" font-weight="600">React Workstation</text>
    <text x="150" y="1892" fill="#38bdf8" font-size="11">Frontend UI</text>

    <rect x="355" y="1850" width="170" height="55" rx="8" fill="#581c87" stroke="#a855f7" stroke-width="2" />
    <text x="440" y="1872" fill="#f8fafc" font-size="14" font-weight="600">loop.go (Engine)</text>
    <text x="440" y="1892" fill="#c084fc" font-size="11">Multi-Turn Loop</text>

    <rect x="645" y="1850" width="170" height="55" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
    <text x="730" y="1872" fill="#f8fafc" font-size="14" font-weight="600">schemas.go</text>
    <text x="730" y="1892" fill="#fbbf24" font-size="11">Tool Definitions</text>

    <rect x="935" y="1850" width="170" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="1020" y="1872" fill="#f8fafc" font-size="14" font-weight="600">External Model</text>
    <text x="1020" y="1892" fill="#4ade80" font-size="11">Gemini / Claude</text>

    <rect x="1225" y="1850" width="170" height="55" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="2" />
    <text x="1310" y="1872" fill="#f8fafc" font-size="14" font-weight="600">tools.go (Runner)</text>
    <text x="1310" y="1892" fill="#fb7185" font-size="11">Tool Execution</text>

    <rect x="1485" y="1850" width="170" height="55" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="1570" y="1872" fill="#f8fafc" font-size="14" font-weight="600">Postgres DB</text>
    <text x="1570" y="1892" fill="#60a5fa" font-size="11">Storage &amp; Ledger</text>
  </g>
</svg>
